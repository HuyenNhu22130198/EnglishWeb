# Đây là profile prod, kích hoạt bằng SPRING_PROFILES_ACTIVE=prod và chỉ override base application.properties.
# CẢNH BÁO ddl-auto=validate: Hibernate KHÔNG tự tạo/sửa schema, chỉ kiểm tra entity khớp bảng.
# Vì project không có Flyway, lần deploy đầu khi DB prod còn rỗng sẽ khiến app KHÔNG boot.
# Quy trình lần đầu: tạo schema trước (ví dụ boot 1 lần với SPRING_PROFILES_ACTIVE trống hoặc tạm đặt ddl-auto=update để sinh bảng), rồi mới chuyển sang profile prod (validate).
# Nhớ chạy tay các câu SQL migration auth provider trên DB prod trước khi validate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
