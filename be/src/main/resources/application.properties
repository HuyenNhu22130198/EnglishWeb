spring.application.name=be
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/StudyEnglishWithNhu}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:change_this_secret_to_a_long_random_string_at_least_32_chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Azure Speech: the subscription key remains on the backend and is exchanged for a short-lived token.
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}

# IELTS Speaking free-answer pipeline
# Whisper runs as a whisper.cpp server container (see docker-compose.yml), not a local binary.
whisper.server-url=${WHISPER_SERVER_URL:http://localhost:8081}
whisper.timeout-seconds=${WHISPER_TIMEOUT_SECONDS:60}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# IELTS Writing AI grading (Gemini) — separate "grade" step, see GeminiWritingGradingService
# Default matches GEMINI_MODEL used for Speaking: gemini-2.0-flash has 0 free-tier quota on this key.
gemini.writing-model=${GEMINI_WRITING_MODEL:gemini-flash-latest}
gemini.writing-timeout-seconds=${GEMINI_WRITING_TIMEOUT_SECONDS:30}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Authentication email (Gmail App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email links and social token exchange
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.facebook.app-id=${FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${FACEBOOK_APP_SECRET:}
app.token.verify-ttl-minutes=${VERIFY_TOKEN_TTL_MINUTES:1440}
app.token.reset-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:30}
